<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171519"><title>月历 · My Life</title>
<style>
:root{color-scheme:dark;--bg:#171519;--tile:#242126;--rose:#e7a0b5;--text:#f6f0f2;--muted:#aaa0a6;--line:#3b333b;--blue:#89a9d1;--green:#8fc4a1;--pink:#e69ab4;--orange:#ee813b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{padding:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}button{font:inherit}.shell{width:100%;max-width:440px;margin:auto;padding:clamp(15px,5vw,23px) clamp(14px,4.8vw,21px) clamp(14px,4vw,19px);background:var(--bg);border-radius:27px;box-shadow:0 15px 46px #100d126e}.eyebrow{font-size:13px;letter-spacing:2px;color:var(--rose);font-weight:600}.header{margin:17px 0 23px}.header h1{margin:0;font-size:clamp(28px,8vw,36px);line-height:1.12;letter-spacing:-.8px;font-weight:600}.header p{margin:8px 0 0;color:var(--muted);font-size:clamp(13px,3.8vw,16px)}.controls{display:flex;align-items:center;gap:9px;margin-bottom:16px}.nav{width:36px;height:36px;border:0;border-radius:15px;background:var(--tile);color:var(--text);font-size:24px;line-height:1;cursor:pointer}.today{margin-left:auto;border:0;border-radius:26px;padding:9px 15px;background:var(--rose);color:#251a20;font-size:14px;font-weight:600;cursor:pointer}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.week{margin-bottom:7px;color:var(--muted);font-size:14px}.week span{padding:4px 0}.day{min-height:clamp(36px,10vw,40px);border:0;border-radius:12px;background:var(--tile);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:clamp(13px,3.6vw,15px);font-variant-numeric:tabular-nums;cursor:pointer}.day.outside{background:transparent;color:#645d63}.day.today{background:#4a303c}.day.selected{box-shadow:inset 0 0 0 1.5px var(--rose)}.dots{height:6px;display:flex;gap:3px}.dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none}.dot.done{background:var(--green)}.dot.late{background:var(--pink)}.legend{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:19px;color:var(--muted);font-size:13px}.legend span{display:flex;align-items:center;gap:6px}.legend .dot{width:8px;height:8px}.divider{height:1px;background:var(--line);margin:23px 0}.date-label{color:var(--rose);font-size:15px;letter-spacing:.6px;font-weight:600}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 14px}.section-head h2{font-size:clamp(19px,5.5vw,23px);line-height:1.25;margin:0;font-weight:600}.card{padding:17px 17px;background:var(--tile);border-radius:17px;margin-top:10px}.card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-title{font-size:clamp(15px,4vw,17px);line-height:1.4;font-weight:500}.badge{flex:none;white-space:nowrap;padding:5px 10px;border-radius:18px;background:#17422e;color:#4fd181;font-size:13px;font-weight:600}.badge.orange{background:#47291e;color:var(--orange)}.meta{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.5}.progress{height:6px;margin-top:12px;background:#4b3942;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--rose);border-radius:8px}.empty{padding:14px 0 4px;color:var(--muted);font-size:14px;line-height:1.5}.auth-panel{padding:14px;background:var(--tile);border-radius:15px;margin:12px 0}.auth-panel p{margin:0 0 10px;color:var(--muted);font-size:13px}.auth-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth-fields input{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#19171a;color:var(--text);font:inherit;font-size:14px}.auth-actions{display:flex;gap:8px;margin-top:9px}.auth-actions button,.logout{padding:8px 12px;border:0;border-radius:10px;background:var(--rose);color:#271b21;font-weight:600;cursor:pointer}.auth-actions button.secondary{background:#383138;color:var(--text)}.auth-message{margin-top:8px;color:var(--muted);font-size:12px;min-height:16px}.logout{margin-left:auto;font-size:12px}.footer{text-align:center;margin-top:23px;color:#7c737a;font-size:13px;letter-spacing:1px}@media(max-width:360px){body{padding:5px}.shell{padding:14px 12px;border-radius:20px}.auth-fields{grid-template-columns:1fr}.controls{gap:7px}.day{border-radius:10px}.legend{gap:8px 11px;font-size:12px}.card{padding:13px}}
</style>
</head>
<body><main class="shell" aria-label="Done List 月历">
<div class="eyebrow">MY LIFE · <span id="year">2026</span></div>
<header class="header"><h1 id="monthTitle">October 2026</h1><p>Make progress, at your own pace.</p></header>
<div class="controls"><button class="nav" id="prev" type="button" aria-label="上个月">‹</button><button class="nav" id="next" type="button" aria-label="下个月">›</button><button class="today" id="goToday" type="button" style="padding:7px 12px;font-size:12px">今天</button></div>
<section aria-label="月历"><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="grid" id="grid"></div></section>
<div class="legend" aria-label="状态说明"><span><i class="dot"></i>计划中</span><span><i class="dot done"></i>按期完成</span><span><i class="dot late"></i>延期完成</span></div>
<div class="divider"></div>
<section><div class="date-label" id="dateLabel"></div><div class="section-head"><h2 style="font-size:clamp(16px,4.8vw,19px)">今日重要日程</h2></div><div id="dayItems" class="empty">正在读取 Done List…</div></section>
<div class="divider"></div>
<section><div class="section-head"><h2 style="font-size:clamp(16px,4.8vw,19px)">本月未完成关键 KR</h2><span class="badge orange" id="krCount">登录后查看</span><button class="logout" id="logout" type="button" aria-label="退出登录" title="退出登录" style="margin-left:auto;width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#383138;color:#e7a0b5" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4H5v16h8"/><path d="M10 12h10m-4-4 4 4-4 4"/></svg></button></div>
<div class="auth-panel" id="authPanel"><p>登录后查看你的 KR 和进度</p><div class="auth-fields"><input id="email" type="email" autocomplete="username" placeholder="邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码"></div><div class="auth-actions"><button id="signIn" type="button">登录</button><button id="signUp" class="secondary" type="button">创建账号</button></div><div class="auth-message" id="authMessage" aria-live="polite"></div></div>
<div id="keyResults"><div class="empty">KR 仅对已验证的本人账号开放</div></div></section>
<footer class="footer">A YEAR OF GROWTH · <span id="footerYear">2026</span></footer>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://kmvdqhsomcvowqqszshk.supabase.co";const SUPABASE_KEY="sb_publishable_KsrxFQ0GwJysxeY_2TdtxQ_pwkh0_oE";const auth=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const API_URL="https://kmvdqhsomcvowqqszshk.supabase.co/functions/v1/mindful-quote";const grid=document.getElementById('grid'),today=new Date();let shown=new Date(today.getFullYear(),today.getMonth(),1),selected=new Date(today),records=[],schedules=[],keyResultsData=[],signedIn=false;const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function render(){const y=shown.getFullYear(),m=shown.getMonth(),first=new Date(y,m,1),offset=first.getDay(),count=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+count)/7)*7;document.getElementById('monthTitle').textContent=shown.toLocaleDateString('en-US',{month:'long',year:'numeric'});document.getElementById('year').textContent=y;grid.replaceChildren();for(let i=0;i<cells;i++){const d=new Date(y,m,1-offset+i),k=key(d),items=records.filter(x=>x.date===k),b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==m?' outside':'')+(k===key(today)?' today':'')+(k===key(selected)?' selected':'');b.setAttribute('aria-label',k);const n=document.createElement('span');n.textContent=d.getDate();b.append(n);const ds=document.createElement('span');ds.className='dots';[...new Set(items.map(x=>x.status))].slice(0,3).forEach(s=>{const dot=document.createElement('i');dot.className='dot'+(s==='Done'?' done':s==='延期完成'?' late':'');ds.append(dot)});b.append(ds);b.onclick=()=>{selected=d;render();renderDay()};grid.append(b)}renderDay();renderKRs(keyResultsData)}
function renderDay(){document.getElementById('dateLabel').textContent=selected.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',weekday:'long'}).toUpperCase().replace(',',' ·');const host=document.getElementById('dayItems'),selectedKey=key(selected),items=schedules.filter(x=>x.start<=selectedKey&&x.end>=selectedKey);host.replaceChildren();if(!items.length){host.className='empty';host.textContent='这一天没有重要日程';return}host.className='';items.forEach(item=>{const card=document.createElement('article');card.className='card';const row=document.createElement('div');row.className='card-row';const title=document.createElement('div');title.className='card-title';title.textContent=item.title||'Life Log 日程';const badge=document.createElement('span');badge.className='badge'+(item.status==='延期完成'?' orange':'');badge.textContent=item.status==='完成'?'已完成':item.status==='Done'?'按期完成':item.status==='延期完成'?'延期完成':item.status==='进行中'?'进行中':item.status==='已预订'?'已预订':item.status||'未开始';row.append(title,badge);card.append(row);if(item.start){const meta=document.createElement('div');meta.className='meta';meta.textContent='计划日期 '+item.start+(item.end&&item.end!==item.start?' 至 '+item.end:'');card.append(meta)}host.append(card)})}
document.getElementById('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render()};document.getElementById('goToday').onclick=()=>{shown=new Date(today.getFullYear(),today.getMonth(),1);selected=new Date(today);render()};document.getElementById('footerYear').textContent=today.getFullYear();render();function renderKRs(items=[]){const host=document.getElementById('keyResults');if(!signedIn){document.getElementById('krCount').textContent='登录后查看';const prompt=document.createElement('div');prompt.className='empty';prompt.textContent='登录后查看 KR 及所属目标';host.replaceChildren(prompt);return}host.replaceChildren();const thisMonth=shown.getFullYear()+'-'+pad(shown.getMonth()+1);const visible=items.filter(x=>!x.start||x.start.slice(0,7)<=thisMonth?(!x.end||x.end.slice(0,7)>=thisMonth):false);document.getElementById('krCount').textContent=`${visible.length} 项待推进`;if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='本月没有未完成关键 KR';host.append(empty);return}visible.forEach(kr=>{const card=document.createElement('article');card.className='card';const row=document.createElement('div');row.className='card-row';const title=document.createElement('div');title.className='card-title';title.textContent=kr.name;const pct=document.createElement('span');pct.style.color='var(--rose)';pct.textContent=`${kr.progress||0}%`;row.append(title,pct);card.append(row);const track=document.createElement('div');track.className='progress';const fill=document.createElement('i');fill.style.width=Math.max(0,Math.min(100,Number(kr.progress)||0))+'%';track.append(fill);card.append(track);const meta=document.createElement('div');meta.className='meta';const details=[];if(kr.goal)details.push('所属目标：'+kr.goal);else if(kr.status)details.push(kr.status);if(kr.end){const due=new Date(Number(kr.end.slice(0,4)),Number(kr.end.slice(5,7))-1,Number(kr.end.slice(8,10)));const now=new Date();now.setHours(0,0,0,0);const days=Math.round((due-now)/86400000);details.push('截止 '+kr.end+' · '+(days>0?'还剩 '+days+' 天':days===0?'今天截止':'已逾期 '+Math.abs(days)+' 天'))}meta.textContent=details.join(' · ')||'未设置截止日期';card.append(meta);host.append(card)})}
async function loadData(session){try{const headers={Accept:'application/json',apikey:SUPABASE_KEY};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(API_URL,{headers});if(!r.ok)throw Error();const data=await r.json();records=Array.isArray(data.items)?data.items:[];schedules=Array.isArray(data.schedules)?data.schedules:[];keyResultsData=session?.access_token&&Array.isArray(data.keyResults)?data.keyResults:[];render()}catch{document.getElementById('dayItems').textContent='暂时无法连接 Done List';keyResultsData=[];renderKRs([])}}function showAuth(user){const logged=!!user;signedIn=logged;document.getElementById('authPanel').hidden=logged;document.getElementById('logout').hidden=!logged;document.getElementById('krCount').textContent=logged?'读取中…':'登录后查看';if(logged)document.getElementById('authMessage').textContent='已登录：'+(user.email||'本人账号')}
document.getElementById('signIn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await auth.auth.signInWithPassword({email,password});document.getElementById('authMessage').textContent=error?'登录失败，请检查邮箱和密码。':'登录成功，正在读取 KR…';if(!error){showAuth(data.user);loadData(data.session)}};
document.getElementById('signUp').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<8){document.getElementById('authMessage').textContent='请输入邮箱，并设置至少 8 位密码。';return}const {data,error}=await auth.auth.signUp({email,password,options:{}});document.getElementById('authMessage').textContent=error?'创建失败：'+error.message:(data.session?'账号已创建并登录。':'账号已创建，请先到邮箱完成验证。');if(data.session){showAuth(data.user);loadData(data.session)}};
document.getElementById('logout').onclick=async()=>{await auth.auth.signOut();showAuth(null);keyResultsData=[];renderKRs([]);document.getElementById('authMessage').textContent='已退出登录。';loadData(null)};
const {data:{session}}=await auth.auth.getSession();showAuth(session?.user||null);loadData(session);
</script></body></html>
