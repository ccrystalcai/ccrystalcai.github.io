<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="给此刻一点安静，一句正念语句。">
  <title>正念语句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; overflow: hidden;
      color: #fff; background: #191919;
    }
    .wash {
      position: fixed; inset: -15%; pointer-events: none;
      background:
        radial-gradient(ellipse 32% 29% at 50% 49%, var(--glow-core), var(--glow-mid) 40%, var(--glow-outer) 68%, transparent 100%),
        radial-gradient(ellipse 46% 42% at 50% 49%, var(--glow-halo), transparent 72%);
      filter: blur(19px); transform: scale(1.04); animation: breathe 18s ease-in-out infinite alternate;
    }
    main { position: relative; width: min(760px, 100%); padding: 34px 28px; text-align: center; }
    #quote {
      margin: 0 auto; max-width: 680px; font-size: clamp(24px, 5.7vw, 40px);
      font-weight: 400; line-height: 1.72; letter-spacing: .045em;
      text-shadow: 0 1px 14px rgba(5, 47, 52, .28);
      animation: arrive .8s ease both;
    }
    .datetime { margin-bottom: 20px; color: rgba(255,255,255,.88); font-size: clamp(15px, 3vw, 18px); letter-spacing: .12em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(5,47,52,.2); }
    .source { margin-top: 28px; color: rgba(255,255,255,.82); font-size: 12px; letter-spacing: .16em; }
    .status { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 0; width: 100%; text-align: center; color: rgba(255,255,255,.66); font-size: 11px; letter-spacing: .08em; }
    @keyframes breathe { to { transform: scale(1.14); opacity: .83; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <main aria-live="polite" aria-atomic="true">
    <div class="datetime" id="datetime" aria-live="off"></div>
    <p id="quote">慢慢来，感受此刻。</p>
    <div class="source" id="source" hidden></div>
  </main>

  <script>
    // Supabase Edge Function 地址；部署到其他项目时请替换为对应地址。
    const API_URL = "https://kmvdqhsomcvowqqszshk.supabase.co/functions/v1/mindful-quote";
    // 部署前请替换为 Supabase Publishable Key（sb_publishable_...），不要填写 Secret 或 service_role key。
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KsrxFQ0GwJysxeY_2TdtxQ_pwkh0_oE";
    const REFRESH_MS = 10 * 60 * 1000;

    const fallback = [
      "我允许自己慢下来，回到此刻。", "每一次呼吸，都是新的开始。", "我可以带着温柔面对今天。",
      "此刻的我，已经足够。", "我不必一次解决所有事情。", "先照顾好此刻的自己。",
      "我愿意接纳此刻真实的感受。", "把注意力放回呼吸，心也会慢慢安定。",
      "我可以一步一步来。", "生活正在一点一点展开。", "我值得被理解，也值得被善待。"
    ];

    const datetimeEl = document.getElementById("datetime");
    const quoteEl = document.getElementById("quote");
    const sourceEl = document.getElementById("source");
    let lastQuote = "";
    let lastPalette = -1;
    let refreshInProgress = false;

    const palettes = [
      ["rgba(18,112,121,.83)", "rgba(55,142,145,.56)", "rgba(137,186,181,.27)", "rgba(205,225,219,.62)"],
      ["rgba(105,82,151,.78)", "rgba(151,128,185,.53)", "rgba(203,185,218,.30)", "rgba(229,219,237,.66)"],
      ["rgba(183,104,91,.76)", "rgba(211,145,124,.51)", "rgba(237,194,171,.29)", "rgba(246,225,211,.67)"],
      ["rgba(55,105,157,.80)", "rgba(103,150,190,.54)", "rgba(171,203,220,.30)", "rgba(218,233,239,.67)"],
      ["rgba(91,125,92,.78)", "rgba(139,169,132,.53)", "rgba(190,211,176,.30)", "rgba(224,235,211,.66)"],
      ["rgba(173,129,57,.77)", "rgba(204,168,99,.51)", "rgba(230,205,151,.29)", "rgba(244,232,201,.67)"]
    ];

    function updateDateTime() {
      const now = new Date();
      const date = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      }).format(now);
      const time = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).format(now);
      datetimeEl.textContent = `${date} · ${time}`;
    }

    function changeGlow() {
      const options = palettes.map((_, index) => index).filter(index => index !== lastPalette);
      lastPalette = options[Math.floor(Math.random() * options.length)];
      const [core, mid, outer, halo] = palettes[lastPalette];
      const wash = document.querySelector(".wash");
      wash.style.setProperty("--glow-core", core);
      wash.style.setProperty("--glow-mid", mid);
      wash.style.setProperty("--glow-outer", outer);
      wash.style.setProperty("--glow-halo", halo);
    }

    function show(quote, source) {
      const cleanQuote = typeof quote === "string" ? quote.trim() : "";
      if (!cleanQuote) return false;

      changeGlow();
      quoteEl.style.animation = "none";
      void quoteEl.offsetWidth;
      quoteEl.style.animation = "";
      quoteEl.textContent = cleanQuote;
      sourceEl.textContent = source || "";
      sourceEl.hidden = !sourceEl.textContent;
      lastQuote = cleanQuote;
      return true;
    }

    function showFallback() {
      const choices = fallback.filter(item => item !== lastQuote);
      const quote = choices[Math.floor(Math.random() * choices.length)] || fallback[0];
      show(quote, "");
    }

    function getSource(data) {
  return typeof data.source === "string" ? data.source.trim() : "";
}

    async function requestQuote() {
      const headers = {};
      const key = SUPABASE_PUBLISHABLE_KEY.trim();
      if (key && !key.startsWith("请替换")) headers.apikey = key;

      const response = await fetch(API_URL, { method: "GET", cache: "no-store", headers });
      if (!response.ok) throw new Error(`请求失败：${response.status}`);
      const data = await response.json();
      if (!data || typeof data.quote !== "string" || !data.quote.trim()) {
        throw new Error("接口没有返回有效语句");
      }
      return data;
    }

    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      try {
        if (!API_URL.trim()) throw new Error("未配置接口地址");
        const data = await requestQuote();

        // 若服务连续返回相同内容，再请求一次；仍重复时改用不同的本地备用语句。
        if (data.quote.trim() === lastQuote) {
          const retryData = await requestQuote();
          if (retryData.quote.trim() === lastQuote) {
            showFallback();
            return;
          }
          show(retryData.quote, getSource(retryData));
        } else {
          show(data.quote, getSource(data));
        }
      } catch (error) {
        showFallback();
      } finally {
        refreshInProgress = false;
      }
    }

    updateDateTime();
    window.setInterval(updateDateTime, 1000);
    refresh();
    window.setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
